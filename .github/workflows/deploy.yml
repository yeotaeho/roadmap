# CI/CD — api·web 이미지를 GHCR 에 빌드·푸시하고 Vultr 서버에 SSH 배포한다.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 연속 푸시 시 배포 경합 방지 — 진행 중 배포는 취소하고 최신만 수행.
concurrency:
  group: deploy
  cancel-in-progress: true

env:
  # 도메인 연결·HTTPS 전환 시 이 값만 바꾸면 된다 (NEXT_PUBLIC_* 는 빌드 타임에 번들로 구워짐).
  PUBLIC_ORIGIN: http://141.164.34.154

jobs:
  build-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/roadmap-api:latest
            ghcr.io/${{ github.repository_owner }}/roadmap-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  build-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: www.yeotaeho.kr
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.PUBLIC_ORIGIN }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/roadmap-web:latest
            ghcr.io/${{ github.repository_owner }}/roadmap-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    needs: [build-api, build-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # compose·nginx 설정을 서버에 동기화.
      - uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VULTR_HOST }}
          username: root
          key: ${{ secrets.VULTR_SSH_KEY }}
          source: deploy/docker-compose.yml,deploy/nginx.conf
          target: /opt/roadmap/
          strip_components: 1
      # 최신 이미지 pull 후 재기동 — 옛 이미지 정리로 디스크 관리.
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VULTR_HOST }}
          username: root
          key: ${{ secrets.VULTR_SSH_KEY }}
          script: |
            set -e
            echo "${{ secrets.GHCR_PULL_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            cd /opt/roadmap
            docker compose pull
            docker compose up -d
            docker image prune -f
