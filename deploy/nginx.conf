# wepon.kr 리버스 프록시 — HTTP 는 HTTPS 로 통합, /api 는 FastAPI, 나머지는 Next.js.

# HTTP — Let's Encrypt 갱신 챌린지만 통과, 나머지는 HTTPS 리다이렉트.
server {
    listen 80;
    server_name wepon.kr www.wepon.kr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://wepon.kr$request_uri;
    }
}

# www → apex 통합 — NEXT_PUBLIC_API_URL(https://wepon.kr)과 origin 을 일치시킨다.
server {
    listen 443 ssl;
    server_name www.wepon.kr;

    ssl_certificate /etc/letsencrypt/live/wepon.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wepon.kr/privkey.pem;

    return 301 https://wepon.kr$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name wepon.kr;

    ssl_certificate /etc/letsencrypt/live/wepon.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wepon.kr/privkey.pem;

    client_max_body_size 20m;

    # FastAPI — /api 프리픽스 그대로 전달 (백엔드 API_V1_PREFIX="/api").
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # SSE 스트리밍(코치·상담·로드맵 진행률) — 버퍼링 금지, 장기 연결 허용.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # Next.js 프론트엔드.
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
